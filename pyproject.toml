[project]
name = "pipeline-youtube"
version = "0.1.0"
description = "YouTube playlist -> Obsidian vault learning pipeline"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.3",
    "yt-dlp>=2026.7.4",  # 2026.7.4 fixes CVE-2026-55404 (2026.6.9 fixed CVE-2026-50019/50023/50574 + GHSA-69qj-pvh9-c5wg)
    "youtube-transcript-api>=0.6",
    "httpx>=0.27",
    # AI calls go through `claude -p` headless CLI (OAuth via Claude plan).
    # No `anthropic` SDK dependency — see providers/claude_cli.py.
]

[project.optional-dependencies]
# Whisper pulls in torch (~2GB). Install only when local transcription fallback is needed:
#   uv sync --extra whisper
whisper = [
    "openai-whisper>=20240930",
    "filelock>=3.13",
]
# Apple-Silicon GPU backend — much faster and lighter than openai-whisper on
# CPU (recommended on M-series Macs). The platform marker makes it a no-op on
# Linux/CI, so `uv sync --extra mlx` is safe everywhere.
#   uv sync --extra mlx
mlx = [
    "mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "filelock>=3.13",
]

[project.scripts]
pipeline-youtube = "pipeline_youtube.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_youtube"]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[tool.uv]
# Pin uv to a known-good range. setup-uv@v7 reads this and installs a matching
# version in CI; uv itself enforces the constraint locally too. Stops the
# "Falling back to latest" message and keeps CI reproducible across runs.
# Bump the lower bound when adopting a newer uv feature.
required-version = ">=0.11.8,<0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Conservative default set: pyflakes, pycodestyle errors + warnings,
# isort, bugbear, pyupgrade, simplify, plus flake8-bandit (S) security
# lints. The S suite is enabled mainly to catch *future* hardcoded
# credentials / weak crypto (S105/S106/S107 hardcoded password & token,
# S324 weak hash, S501 cert-verify-off, etc.). Current vetted findings are
# suppressed below so CI stays green without disabling the whole suite.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]
# Allow ambiguous-var names in pedagogical/Japanese-heavy codebase.
ignore = [
    "E501",  # line length: enforced by formatter only when auto-fixable
    "B008",  # click.Option(...) in decorator default is idiomatic
    "SIM108",  # ternary vs if/else readability is case-by-case
    # --- flake8-bandit: current vetted findings (keep the S suite active) ---
    "S101",  # assert: used as invariant checks; pytest relies on assert
    "S603",  # subprocess call: all call sites use list args (shell=False) + flag guards
    "S607",  # partial executable path: resolved/validated binaries (claude_cli/ffmpeg)
    "S310",  # urllib open: code_fetch uses a hard host allowlist (github only)
    "S311",  # non-crypto random: used for non-security jitter/sampling only
    "S108",  # hardcoded /tmp path: vetted temp usage
    "S110",  # try/except/pass: intentional best-effort (e.g. alert sink)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False in tests

[tool.mypy]
# Keep CI and local mypy runs in sync — do not duplicate flags in the workflow.
python_version = "3.13"
ignore_missing_imports = true
